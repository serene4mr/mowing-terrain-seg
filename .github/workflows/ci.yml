name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install PyTorch (CPU) and OpenMMLab
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          pip install mmengine
          pip install "mmcv==2.1.0" -f https://download.openmmlab.com/mmcv/dist/cpu/torch2.1/index.html
          pip install mmdet==3.3.0 mmsegmentation==1.2.2
          pip install openmim ftfy regex tqdm opencv-python-headless pillow matplotlib
          pip install protobuf onnx
      - name: Install project (editable + dev)
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tools tests || true
      - name: Pytest
        run: python -m pytest tests/ -q
